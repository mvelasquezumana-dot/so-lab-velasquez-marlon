# nginx.conf completo (reemplaza /etc/nginx/nginx.conf de la imagen)
worker_processes 1;            # 'auto' crearía un worker por CPU VISIBLE del host: cgroups no oculta CPUs
worker_rlimit_nofile 4096;     # límite de FDs del worker (cada petición proxied usa 2 sockets)
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;   # incluye conexiones cliente + upstream
}

http {
    access_log off;
    resolver 127.0.0.11 valid=10s ipv6=off;   # DNS embebido de Docker: re-resuelve si order-api se recrea

    server {
        listen 80;
        location / {
            set $api http://order-api:8080;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 120s;          # /cpu estrangulado y /slow pueden tardar
        }
    }
}
